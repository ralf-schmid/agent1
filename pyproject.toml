[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "losungs-bot"
version = "1.0.0"
description = "Ein Mastodon-Bot, der täglich die Herrnhuter Losungen postet"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Ralf Schmid" }
]

dependencies = [
    "Mastodon.py>=1.8.1",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "apscheduler>=3.10.4,<4.0.0",
    "structlog>=24.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
losungs-bot = "losungs_bot.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/losungs_bot"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
