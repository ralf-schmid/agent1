---
# ConfigMap für Prometheus Konfiguration
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    scrape_configs:
      - job_name: 'losungsbot'
        static_configs:
          - targets: ['losungsbot:8080']
        # Alternative: wenn Bot im gleichen Pod läuft
        # - targets: ['localhost:8080']

---
# Prometheus Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=30d'
            - '--web.enable-lifecycle'
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-data
          emptyDir: {}
          # Für persistente Daten stattdessen:
          # persistentVolumeClaim:
          #   claimName: prometheus-pvc

---
# Prometheus Service
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090

---
# Service für den Losungsbot (falls noch nicht vorhanden)
# Damit Prometheus den Bot erreichen kann
apiVersion: v1
kind: Service
metadata:
  name: losungsbot
spec:
  selector:
    app: losungsbot  # Anpassen an dein Deployment-Label!
  ports:
    - name: metrics
      port: 8080
      targetPort: 8080
